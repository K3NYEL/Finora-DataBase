services:
  finora-database:
    build:
      context: .
      dockerfile: Dockerfile
    image: finora-database-api:local
    container_name: finora-database-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/finora.db
      BACKUP_STORAGE_PATH: /data/backups
    ports:
      # Keep the API private on the host. Put a trusted HTTPS reverse proxy in front.
      - "127.0.0.1:3000:3000"
    volumes:
      - finora_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  finora_data:
